# Scan the mounted directory, then serve the console.
services:
  cryptonex:
    build: .
    command: >
      sh -c "cryptonex scan /scan --out /out &&
             cryptonex serve --result /out/result.json --port 8713"
    ports:
      - "8713:8713"
    volumes:
      - ${SCAN_DIR:-./tests/fixtures/vulnerable-repo}:/scan:ro
      - ./cryptonex-out:/out
