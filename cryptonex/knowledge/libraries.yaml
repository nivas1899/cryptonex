# Package -> cryptography it provides. `flag: true` (or a matched version ceiling)
# marks the library itself as a migration concern and emits its provided primitives
# as assets tied to the manifest location.
version: "2026.02"
libraries:
  - {ecosystem: pip, name: pyjwt, version_lt: "2.0.0", flag: true,
     reason: "PyJWT < 2.0 defaults to HS256 and predates algorithm-confusion hardening.",
     provides: [{raw: hs256}]}
  - {ecosystem: pip, name: pycryptodome,
     provides: [{raw: rsa}, {raw: "aes-256-cbc"}, {raw: dsa}]}
  - {ecosystem: pip, name: cryptography,
     provides: [{raw: rsa}, {raw: ecdsa}]}
  - {ecosystem: pip, name: rsa, flag: true,
     reason: "The pure-Python 'rsa' package implements RSA only.",
     provides: [{raw: rsa}]}
  - {ecosystem: pip, name: bcrypt, provides: [{raw: bcrypt}]}
  - {ecosystem: pip, name: argon2-cffi, provides: [{raw: argon2id}]}
  - {ecosystem: pip, name: pyopenssl, provides: [{raw: rsa}, {raw: ecdsa}]}
  - {ecosystem: pip, name: paramiko, provides: [{raw: rsa}, {raw: ed25519}]}

  - {ecosystem: maven, name: "org.bouncycastle:bcprov-jdk15on", version_lt: "1.71", flag: true,
     reason: "BouncyCastle prior to 1.71/jdk18on predates the post-quantum provider.",
     provides: [{raw: rsa}, {raw: ecdsa}, {raw: dh}]}
  - {ecosystem: maven, name: "org.bouncycastle:bcprov-jdk18on",
     provides: [{raw: rsa}, {raw: ecdsa}, {raw: dh}]}
  - {ecosystem: maven, name: "com.auth0:java-jwt", provides: [{raw: hs256}]}

  - {ecosystem: npm, name: jsonwebtoken, provides: [{raw: hs256}]}
  - {ecosystem: npm, name: node-forge, provides: [{raw: rsa}, {raw: "aes-256-cbc"}, {raw: des}]}
  - {ecosystem: npm, name: bcryptjs, provides: [{raw: bcrypt}]}
  - {ecosystem: npm, name: "node-rsa", flag: true, reason: "RSA-only helper.", provides: [{raw: rsa}]}

  - {ecosystem: go, name: "golang.org/x/crypto", provides: [{raw: ed25519}, {raw: chacha20}]}

  # --- additional coverage ---
  - {ecosystem: pip, name: pynacl, provides: [{raw: ed25519}, {raw: x25519}, {raw: "chacha20-poly1305"}]}
  - {ecosystem: pip, name: "m2crypto", flag: true, reason: "M2Crypto is lightly maintained and ships OpenSSL-1.x bindings.", provides: [{raw: rsa}, {raw: "aes-256-cbc"}]}
  - {ecosystem: pip, name: "pycrypto", flag: true, reason: "PyCrypto is unmaintained since 2013 and has known vulnerabilities (CVE-2013-7459).", provides: [{raw: rsa}, {raw: "aes-256-cbc"}, {raw: des}]}
  - {ecosystem: pip, name: "oscrypto", provides: [{raw: rsa}, {raw: ecdsa}]}
  - {ecosystem: pip, name: "python-jose", flag: true, reason: "python-jose has had algorithm-confusion advisories; verify the pinned version.", provides: [{raw: hs256}, {raw: rs256}]}
  - {ecosystem: pip, name: "authlib", provides: [{raw: rs256}, {raw: es256}]}
  - {ecosystem: pip, name: "liboqs-python", provides: [{raw: "ml-kem"}, {raw: "ml-dsa"}]}
  - {ecosystem: pip, name: "quantcrypt", provides: [{raw: "ml-kem"}, {raw: "ml-dsa"}]}

  - {ecosystem: npm, name: crypto-js, flag: true, reason: "crypto-js defaults and PBKDF2 iteration counts are weak; the maintained fork or WebCrypto is preferred.", provides: [{raw: "aes-256-cbc"}, {raw: md5}, {raw: sha1}]}
  - {ecosystem: npm, name: jsrsasign, provides: [{raw: rsa}, {raw: ecdsa}]}
  - {ecosystem: npm, name: elliptic, flag: true, reason: "`elliptic` has had signature-malleability / timing advisories (CVE-2024-48948 family).", provides: [{raw: ecdsa}]}
  - {ecosystem: npm, name: tweetnacl, provides: [{raw: ed25519}, {raw: x25519}]}
  - {ecosystem: npm, name: "@noble/curves", provides: [{raw: ecdsa}, {raw: ed25519}]}
  - {ecosystem: npm, name: "@noble/post-quantum", provides: [{raw: "ml-kem"}, {raw: "ml-dsa"}]}

  - {ecosystem: maven, name: "org.bouncycastle:bcpkix-jdk15on", version_lt: "1.71", flag: true, reason: "Pre-PQC BouncyCastle PKIX.", provides: [{raw: rsa}, {raw: ecdsa}]}
  - {ecosystem: maven, name: "com.nimbusds:nimbus-jose-jwt", provides: [{raw: rs256}, {raw: es256}]}
  - {ecosystem: maven, name: "io.jsonwebtoken:jjwt", provides: [{raw: hs256}, {raw: rs256}]}
  - {ecosystem: maven, name: "org.bouncycastle:bcprov-jdk18on", version_lt: "1.78", flag: true, reason: "BouncyCastle < 1.78 predates hardened ML-KEM/ML-DSA.", provides: [{raw: rsa}, {raw: ecdsa}, {raw: dh}]}

  - {ecosystem: go, name: "github.com/cloudflare/circl", provides: [{raw: "ml-kem"}, {raw: "ml-dsa"}, {raw: x25519}]}
  - {ecosystem: go, name: "github.com/dgrijalva/jwt-go", flag: true, reason: "dgrijalva/jwt-go is deprecated and had an auth-bypass (CVE-2020-26160); migrate to golang-jwt/jwt.", provides: [{raw: hs256}, {raw: rs256}]}
  - {ecosystem: go, name: "github.com/golang-jwt/jwt", provides: [{raw: hs256}, {raw: rs256}]}

  - {ecosystem: pip, name: "django", provides: [{raw: pbkdf2}]}
  - {ecosystem: pip, name: "flask-bcrypt", provides: [{raw: bcrypt}]}
  - {ecosystem: pip, name: "passlib", provides: [{raw: bcrypt}, {raw: argon2id}, {raw: pbkdf2}]}
  - {ecosystem: pip, name: "ecdsa", flag: true, reason: "pure-Python `ecdsa` has had timing side-channel advisories (CVE-2024-23342).", provides: [{raw: ecdsa}]}
  - {ecosystem: pip, name: "rsa", flag: true, reason: "pure-Python `rsa` — Bleichenbacher-style issues; RSA only.", provides: [{raw: rsa}]}
  - {ecosystem: pip, name: "cryptg", provides: [{raw: "aes-256-cbc"}]}

  # --- Rust (Cargo) ---
  - {ecosystem: cargo, name: "openssl", provides: [{raw: rsa}, {raw: ecdsa}, {raw: "aes-256-gcm"}]}
  - {ecosystem: cargo, name: "rsa", flag: true, reason: "The `rsa` crate has a Marvin timing side channel (RUSTSEC-2023-0071).", provides: [{raw: rsa}]}
  - {ecosystem: cargo, name: "ring", provides: [{raw: ed25519}, {raw: ecdsa}, {raw: "aes-256-gcm"}]}
  - {ecosystem: cargo, name: "aes-gcm", provides: [{raw: "aes-256-gcm"}]}
  - {ecosystem: cargo, name: "chacha20poly1305", provides: [{raw: "chacha20-poly1305"}]}
  - {ecosystem: cargo, name: "ed25519-dalek", provides: [{raw: ed25519}]}
  - {ecosystem: cargo, name: "x25519-dalek", provides: [{raw: x25519}]}
  - {ecosystem: cargo, name: "p256", provides: [{raw: ecdsa}]}
  - {ecosystem: cargo, name: "sha2", provides: [{raw: sha256}]}
  - {ecosystem: cargo, name: "md-5", flag: true, reason: "MD5 is broken.", provides: [{raw: md5}]}
  - {ecosystem: cargo, name: "sha1", flag: true, reason: "SHA-1 is broken.", provides: [{raw: sha1}]}
  - {ecosystem: cargo, name: "pqcrypto", provides: [{raw: "ml-kem"}, {raw: "ml-dsa"}]}
  - {ecosystem: cargo, name: "argon2", provides: [{raw: argon2id}]}
  - {ecosystem: cargo, name: "jsonwebtoken", provides: [{raw: hs256}, {raw: rs256}]}
  - {ecosystem: cargo, name: "rustls", provides: [{raw: x25519}, {raw: "aes-256-gcm"}]}

  # --- .NET (NuGet) ---
  - {ecosystem: nuget, name: "BouncyCastle", version_lt: "2.0.0", flag: true, reason: "Legacy Portable.BouncyCastle predates PQC.", provides: [{raw: rsa}, {raw: ecdsa}, {raw: dh}]}
  - {ecosystem: nuget, name: "BouncyCastle.Cryptography", provides: [{raw: rsa}, {raw: ecdsa}, {raw: "ml-kem"}]}
  - {ecosystem: nuget, name: "System.IdentityModel.Tokens.Jwt", provides: [{raw: rs256}, {raw: hs256}]}
  - {ecosystem: nuget, name: "jose-jwt", provides: [{raw: rs256}, {raw: es256}]}
  - {ecosystem: nuget, name: "NSec.Cryptography", provides: [{raw: ed25519}, {raw: x25519}]}
  - {ecosystem: nuget, name: "Sodium.Core", provides: [{raw: ed25519}, {raw: x25519}]}

  # --- Ruby (gem) ---
  - {ecosystem: gem, name: "jwt", provides: [{raw: hs256}, {raw: rs256}]}
  - {ecosystem: gem, name: "bcrypt", provides: [{raw: bcrypt}]}
  - {ecosystem: gem, name: "rbnacl", provides: [{raw: ed25519}, {raw: x25519}]}
  - {ecosystem: gem, name: "openssl", provides: [{raw: rsa}, {raw: ecdsa}, {raw: "aes-256-gcm"}]}
  - {ecosystem: gem, name: "argon2", provides: [{raw: argon2id}]}
  - {ecosystem: gem, name: "digest-crc", provides: []}

  # --- PHP (composer) ---
  - {ecosystem: composer, name: "firebase/php-jwt", provides: [{raw: hs256}, {raw: rs256}]}
  - {ecosystem: composer, name: "lcobucci/jwt", provides: [{raw: hs256}, {raw: es256}]}
  - {ecosystem: composer, name: "paragonie/halite", provides: [{raw: x25519}, {raw: "chacha20-poly1305"}]}
  - {ecosystem: composer, name: "phpseclib/phpseclib", provides: [{raw: rsa}, {raw: ecdsa}, {raw: "aes-256-cbc"}]}
  - {ecosystem: composer, name: "defuse/php-encryption", provides: [{raw: "aes-256-ctr"}]}
  - {ecosystem: composer, name: "web-token/jwt-framework", provides: [{raw: rs256}, {raw: es256}]}

  # --- Swift (CocoaPods) ---
  - {ecosystem: cocoapods, name: "CryptoSwift", flag: true, reason: "CryptoSwift is not constant-time; prefer Apple CryptoKit.", provides: [{raw: "aes-256-cbc"}, {raw: sha256}]}
  - {ecosystem: cocoapods, name: "Sodium", provides: [{raw: ed25519}, {raw: x25519}]}
  - {ecosystem: cocoapods, name: "OpenSSL-Universal", provides: [{raw: rsa}, {raw: "aes-256-gcm"}]}
  - {ecosystem: cocoapods, name: "JWTDecode", provides: [{raw: rs256}]}
