language: python
extensions: [".py"]
rules:
  - id: py.hashlib.direct
    regex: 'hashlib\.(?P<algo>md5|sha1|sha224|sha256|sha384|sha512|sha3_256|sha3_512)\s*\('
    raw_name: "{algo}"
    confidence: high
  - id: py.hashlib.new
    regex: 'hashlib\.new\(\s*[''"](?P<algo>[A-Za-z0-9_-]+)[''"]'
    raw_name: "{algo}"
    confidence: high
  - id: py.pbkdf2
    regex: 'pbkdf2_hmac\(\s*[''"](?P<hash>[A-Za-z0-9]+)[''"]'
    raw_name: "pbkdf2-hmac-{hash}"
    primitive: kdf
    confidence: high
  - id: py.jwt.encode
    regex: 'jwt\.(?:encode|decode)\([^)]*?algorithms?\s*=\s*\[?\s*[''"](?P<algo>[A-Za-z0-9]+)[''"]'
    raw_name: "{algo}"
    primitive: signature
    confidence: high
  - id: py.bcrypt
    regex: 'bcrypt\.(?:hashpw|gensalt|kdf)\s*\('
    raw_name: bcrypt
    primitive: kdf
    confidence: high
  - id: py.argon2
    regex: 'argon2|PasswordHasher\('
    raw_name: argon2id
    primitive: kdf
    confidence: medium
  - id: py.crypto.rsa
    regex: 'rsa\.generate_private_key\s*\(|RSA\.generate\s*\(|serialization.*RSAPrivateKey'
    raw_name: rsa
    primitive: pke
    confidence: high
  - id: py.crypto.ec
    regex: 'ec\.generate_private_key\s*\(\s*ec\.SECP(?P<bits>\d+)R1|ec\.generate_private_key\s*\(|ECC\.generate\s*\('
    raw_name: ecdsa
    primitive: signature
    confidence: medium
  - id: py.crypto.dh
    regex: 'dh\.generate_parameters\s*\(|DiffieHellman'
    raw_name: dh
    primitive: key-agreement
    confidence: medium
  - id: py.crypto.aesgcm
    regex: 'AESGCM\(|modes\.GCM\('
    raw_name: aesgcm
    primitive: aead
    confidence: high
  - id: py.crypto.aescbc
    regex: 'modes\.CBC\('
    raw_name: "aes-256-cbc"
    primitive: block-cipher
    confidence: medium
  - id: py.fernet
    regex: 'Fernet\('
    raw_name: fernet
    confidence: medium
  - id: py.des3
    regex: 'TripleDES\(|DES3\.|algorithms\.TripleDES\('
    raw_name: "3des"
    confidence: medium
  - id: py.des
    regex: 'algorithms\.(DES|Blowfish|CAST5|IDEA|SEED)\('
    raw_name: des
    confidence: medium
  - id: py.rc4
    regex: 'ARC4\(|Cipher\.ARC4|algorithms\.ARC4\('
    raw_name: rc4
    confidence: medium
  - id: py.chacha
    regex: 'ChaCha20Poly1305\(|algorithms\.ChaCha20\('
    raw_name: "chacha20-poly1305"
    primitive: aead
    confidence: high
  - id: py.ed25519
    regex: 'ed25519\.Ed25519PrivateKey|Ed25519PrivateKey\.(generate|from_)'
    raw_name: ed25519
    primitive: signature
    confidence: high
  - id: py.x25519
    regex: 'x25519\.X25519PrivateKey|X25519PrivateKey\.(generate|from_)'
    raw_name: x25519
    primitive: key-agreement
    confidence: high
  - id: py.dsa
    regex: 'dsa\.generate_private_key\s*\(|DSA\.generate\s*\('
    raw_name: dsa
    primitive: signature
    confidence: high
  - id: py.nacl
    regex: 'nacl\.(secret|public|signing)\.|SigningKey\.generate\s*\(|PrivateKey\.generate\s*\('
    raw_name: x25519
    primitive: key-agreement
    confidence: medium
  - id: py.jwt_lib
    regex: 'from\s+jose\s+import|python_jwt|jwcrypto'
    raw_name: rs256
    primitive: signature
    confidence: low
  - id: py.oqs
    regex: '\boqs\.(KeyEncapsulation|Signature)\s*\(\s*[''"](?P<algo>[A-Za-z0-9\-]+)[''"]'
    raw_name: "{algo}"
    confidence: high
  - id: py.scrypt
    regex: 'Scrypt\s*\(|hashlib\.scrypt\s*\('
    raw_name: scrypt
    primitive: kdf
    confidence: high
  - id: py.hkdf
    regex: '\bHKDF\s*\(|HKDFExpand\s*\('
    raw_name: hkdf
    primitive: kdf
    confidence: high
  - id: py.hmac_module
    regex: 'hmac\.new\s*\([^)]*digestmod\s*=\s*[''"]?(?:hashlib\.)?(?P<h>sha1|sha256|sha512|md5)'
    raw_name: "hmac-{h}"
    primitive: mac
    confidence: high
