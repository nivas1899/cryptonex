language: go
extensions: [".go"]
rules:
  - id: go.md5
    regex: '\bmd5\.(New|Sum)\b'
    raw_name: md5
    confidence: high
  - id: go.sha1
    regex: '\bsha1\.(New|Sum)\b'
    raw_name: sha1
    confidence: high
  - id: go.sha256
    regex: '\bsha256\.(New|New224|Sum256|Sum224)\b'
    raw_name: sha256
    confidence: high
  - id: go.sha512
    regex: '\bsha512\.(New|Sum512|Sum384)\b'
    raw_name: sha512
    confidence: high
  - id: go.sha3
    regex: '\bsha3\.(New256|New512|Sum256)\b'
    raw_name: "sha3-256"
    confidence: high
  - id: go.aesgcm
    regex: 'cipher\.NewGCM\('
    raw_name: "aes-256-gcm"
    primitive: aead
    confidence: medium
  - id: go.aescbc
    regex: 'cipher\.NewCBCEncrypter\(|cipher\.NewCBCDecrypter\('
    raw_name: "aes-256-cbc"
    primitive: block-cipher
    confidence: medium
  - id: go.rsa
    regex: 'rsa\.(GenerateKey|SignPKCS1v15|SignPSS|EncryptOAEP|DecryptOAEP)\('
    raw_name: rsa
    primitive: pke
    confidence: high
  - id: go.ecdsa
    regex: 'ecdsa\.(GenerateKey|SignASN1|Sign|Verify)\('
    raw_name: ecdsa
    primitive: signature
    confidence: high
  - id: go.ed25519
    regex: 'ed25519\.(GenerateKey|Sign|NewKeyFromSeed)\('
    raw_name: ed25519
    primitive: signature
    confidence: high
  - id: go.ecdh
    regex: 'ecdh\.(P256|P384|X25519)\('
    raw_name: ecdh
    primitive: key-agreement
    confidence: high
  - id: go.des
    regex: 'des\.NewTripleDESCipher\(|des\.NewCipher\('
    raw_name: "3des"
    confidence: medium
  - id: go.rc4
    regex: 'rc4\.NewCipher\('
    raw_name: rc4
    confidence: high
  - id: go.chacha20
    regex: 'chacha20poly1305\.New\(|chacha20\.NewUnauthenticatedCipher\('
    raw_name: "chacha20-poly1305"
    primitive: aead
    confidence: high
  - id: go.dsa
    regex: 'dsa\.(GenerateKey|Sign|Verify)\('
    raw_name: dsa
    primitive: signature
    confidence: high
  - id: go.dh_ecdh
    regex: '\becdh\.(P256|P384|P521|X25519)\(\)\.'
    raw_name: ecdh
    primitive: key-agreement
    confidence: high
  - id: go.tls_version
    regex: '(MinVersion|MaxVersion)\s*:\s*tls\.Version(?P<v>SSL30|TLS10|TLS11|TLS12|TLS13)'
    raw_name: ecdh
    primitive: key-agreement
    external: true
    confidence: low
  - id: go.tls_ciphers
    regex: 'tls\.TLS_(?P<c>RSA_WITH_[A-Z0-9_]+|ECDHE_[A-Z0-9_]+|AES_128_GCM_SHA256)'
    raw_name: ecdh
    primitive: key-agreement
    external: true
    confidence: low
  - id: go.curvepref
    regex: 'CurvePreferences\s*:\s*\[\]tls\.CurveID\{[^}]*(X25519|CurveP256|CurveP384|X25519MLKEM768)'
    raw_name: x25519
    primitive: key-agreement
    external: true
    confidence: medium
  - id: go.pbkdf2
    regex: 'pbkdf2\.Key\s*\('
    raw_name: "pbkdf2-hmac-sha256"
    primitive: kdf
    confidence: medium
  - id: go.scrypt
    regex: 'scrypt\.Key\s*\('
    raw_name: scrypt
    primitive: kdf
    confidence: high
  - id: go.argon2
    regex: 'argon2\.(IDKey|Key)\s*\('
    raw_name: argon2id
    primitive: kdf
    confidence: high
  - id: go.hkdf
    regex: 'hkdf\.(New|Extract|Expand)\s*\('
    raw_name: hkdf
    primitive: kdf
    confidence: high
  - id: go.circl_pqc
    regex: 'circl/(kem|sign)/(mlkem|mldsa|kyber|dilithium)|schemes\.ByName\("(?P<algo>ML-KEM-\d+|ML-DSA-\d+)"'
    raw_name: "{algo}"
    confidence: medium
  - id: go.bcrypt
    regex: 'bcrypt\.(GenerateFromPassword|CompareHashAndPassword)\('
    raw_name: bcrypt
    primitive: kdf
    confidence: high
