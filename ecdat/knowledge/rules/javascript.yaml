language: javascript
extensions: [".js", ".mjs", ".cjs", ".ts", ".jsx", ".tsx"]
rules:
  - id: js.createhash
    regex: "createHash\\(\\s*['\"](?P<algo>[A-Za-z0-9-]+)['\"]"
    raw_name: "{algo}"
    confidence: high
  - id: js.createhmac
    regex: "createHmac\\(\\s*['\"](?P<algo>[A-Za-z0-9-]+)['\"]"
    raw_name: "hmac-{algo}"
    primitive: mac
    confidence: high
  - id: js.cipheriv
    regex: "createCipheriv\\(\\s*['\"](?P<algo>[A-Za-z0-9-]+)['\"]"
    raw_name: "{algo}"
    confidence: high
  - id: js.sign
    regex: "createSign\\(\\s*['\"](?P<algo>[A-Za-z0-9-]+)['\"]"
    raw_name: "{algo}"
    primitive: signature
    confidence: medium
  - id: js.jwt
    regex: "(?:sign|verify)\\([^)]*?algorithm[s]?\\s*:\\s*\\[?\\s*['\"](?P<algo>[A-Za-z0-9]+)['\"]"
    raw_name: "{algo}"
    primitive: signature
    confidence: high
  - id: js.generatekeypair
    regex: "generateKeyPair(?:Sync)?\\(\\s*['\"](?P<algo>[A-Za-z0-9]+)['\"]"
    raw_name: "{algo}"
    confidence: high
  - id: js.pbkdf2
    regex: "pbkdf2(?:Sync)?\\([^)]*['\"](?P<hash>sha1|sha256|sha512)['\"]"
    raw_name: "pbkdf2-hmac-{hash}"
    primitive: kdf
    confidence: medium
  - id: js.bcrypt
    regex: "bcrypt\\.(hash|genSalt|hashSync)\\("
    raw_name: bcrypt
    primitive: kdf
    confidence: high
  - id: js.scrypt
    regex: "crypto\\.scrypt(Sync)?\\(|scryptSync\\("
    raw_name: scrypt
    primitive: kdf
    confidence: high
  - id: js.argon2
    regex: "argon2\\.(hash|verify)\\(|from\\s+['\"]argon2['\"]"
    raw_name: argon2id
    primitive: kdf
    confidence: high
  - id: js.hkdf
    regex: "crypto\\.hkdf(Sync)?\\("
    raw_name: hkdf
    primitive: kdf
    confidence: high
  - id: js.diffiehellman
    regex: "crypto\\.(createDiffieHellman|createECDH)\\(\\s*['\"]?(?P<g>[A-Za-z0-9-]+)?"
    raw_name: dh
    primitive: key-agreement
    confidence: high
  - id: js.webcrypto
    regex: "subtle\\.(encrypt|sign|deriveKey|generateKey)\\([^)]*name\\s*:\\s*['\"](?P<algo>AES-GCM|AES-CBC|RSA-OAEP|RSA-PSS|ECDSA|ECDH|HMAC|PBKDF2)['\"]"
    raw_name: "{algo}"
    confidence: high
  - id: js.tweetnacl
    regex: "nacl\\.(box|sign|secretbox|scalarMult)\\b"
    raw_name: x25519
    primitive: key-agreement
    confidence: medium
  - id: js.noble.pqc
    regex: "@noble/post-quantum|ml_kem768|ml_dsa65|mlkem|mldsa"
    raw_name: "ml-kem"
    primitive: kem
    confidence: medium
  - id: js.getrandomvalues
    regex: "crypto\\.getRandomValues\\(|crypto\\.randomBytes\\("
    raw_name: drbg
    primitive: drbg
    confidence: high
