[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cryptonex"
version = "0.9.0"
description = "CRYPTONEX — cryptographic discovery, post-quantum risk assessment, and migration planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Team CRYPTONEX" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
gui = ["streamlit>=1.30", "pandas>=2.0"]
binary = ["lief>=0.14"]
validate = ["jsonschema>=4.17"]
dev = ["pytest>=8.0", "jsonschema>=4.17", "streamlit>=1.30", "pandas>=2.0", "lief>=0.14"]

[project.scripts]
cryptonex = "cryptonex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cryptonex"]
artifacts = ["cryptonex/knowledge/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
